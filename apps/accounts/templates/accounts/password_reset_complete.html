{% extends "base.html" %}

{% load static %}

{% block body %}

<div class="min-h-screen flex items-center justify-center bg-base-300 px-4">

    <main
        class="
            w-full
            max-w-md
            bg-base-200
            rounded-2xl
            border
            border-[var(--border-shadow)]
            shadow-custom
            p-8
        "
    >

        <!-- Header -->

        <div class="flex flex-col items-center">

            <div class="bg-green-600 p-4 rounded-full text-white mb-5">
                {% include "icons/check.html" %}
            </div>

            <h1 class="text-2xl font-semibold text-center">
                Contraseña actualizada
            </h1>

            <p class="text-sm text-base-content/60 text-center mt-3 leading-6">

                Tu contraseña fue actualizada correctamente.

            </p>

            <p class="text-sm text-base-content/60 text-center mt-2 leading-6">

                Ya puedes iniciar sesión utilizando tu nueva contraseña.

            </p>

        </div>

        <div class="divider my-8"></div>

        <div class="space-y-3">

            <a
                href="{% url 'login' %}"
                class="btn btn-primary w-full"
            >
                Iniciar sesión
            </a>

            <a
                href="{% url 'password_reset' %}"
                class="btn btn-outline w-full"
            >
                Recuperar nuevamente
            </a>

        </div>

    </main>

</div>

{% endblock %}
