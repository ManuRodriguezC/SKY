version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: sky_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: sky_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    ports:
      - "5432:5432"

  tailwind:
    build:
      context: .
      dockerfile: docker/django/Dockerfile

    working_dir: /app/theme/static_src

    command: npm run dev

    stdin_open: true
    tty: true
    
    volumes:
      - .:/app
      - /app/theme/static_src/node_modules
    
    env_file:
      - .env
    depends_on:
      - web
  
  redis:
    image: redis:7-alpine

    container_name: redis

    restart: unless-stopped

    ports:
      - "6379:6379"
  
  celery:
    build:
      context: .
      dockerfile: docker/django/Dockerfile

    container_name: celery

    command: celery -A config worker -l info

    volumes:
      - .:/app
    
    depends_on:
      - db
      - redis
    
    env_file:
      - .env
  
  celery-beat:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    

    container_name: celery-beat

    command: celery -A config beat -l info #--schedule=/app/celerybeat/celerybeat-schedule

    volumes:
      - .:/app
      # - celerybeat_data:/app/celerybeat

    depends_on:
      - db
      - redis

    env_file:
      - .env

volumes:
  postgres_data:
  celerybeat_data: